<!-- Стили и шрифты сайта GASUP. Этот блок должен быть ПЕРВЫМ на странице.
     Ничего не выводит — только подключает шрифты и CSS. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090b;
  --bg-2:#0b0e12;
  --panel:#11151a;
  --panel-2:#171d24;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.17);
  --tx:#edf2f6;
  --tx-2:#a2adb9;
  --tx-3:#6b7683;
  --gas:#6cc024;
  --gas-2:#8fe13b;
  --gas-3:#b6f45f;
  --warn:#ffb020;
  --grad:linear-gradient(135deg,#6cc024 0%,#a3e635 100%);
  --grad-soft:linear-gradient(135deg,rgba(108,192,36,.16),rgba(163,230,53,.06));
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --shadow:0 26px 64px -24px rgba(0,0,0,.85);
  --glow:0 14px 40px -12px rgba(108,192,36,.55);
  --maxw:1240px;
  --pad:clamp(18px,4vw,40px);}
.gu *, .gu *::before, .gu *::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:17px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.gu img, .gu svg{max-width:100%;display:block}
.gu a{color:inherit;text-decoration:none}
.gu button, .gu input, .gu select, .gu textarea{font:inherit;color:inherit}
.gu h1, .gu h2, .gu h3, .gu h4{font-family:'Unbounded',sans-serif;font-weight:700;line-height:1.08;letter-spacing:-.025em;margin:0}
.gu h1{font-size:clamp(31px,5.4vw,66px)}
.gu h2{font-size:clamp(26px,3.8vw,48px)}
.gu h3{font-size:clamp(18px,1.9vw,24px)}
.gu p{margin:0}
.gu .wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.gu section{position:relative}
.gu .sec{padding:clamp(62px,8.5vw,120px) 0}
.gu .sec-head{max-width:76ch;margin-bottom:clamp(30px,4vw,54px)}
.gu .eyebrow{display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;
  color:var(--gas-2);margin-bottom:16px;}
.gu .eyebrow::before{content:"";width:26px;height:2px;background:var(--grad);border-radius:2px}
.gu .lead{color:var(--tx-2);font-size:clamp(15.5px,1.4vw,18.5px);max-width:66ch;margin-top:16px}
.gu .gr{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gu .hint{font-size:12.5px;color:var(--tx-3);line-height:1.5}
.gu .btn{--bh:58px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:var(--bh);padding:0 30px;border-radius:999px;border:0;cursor:pointer;
  font-weight:800;font-size:15.5px;white-space:nowrap;position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s,background .25s,border-color .25s,color .25s;}
.gu .btn:active{transform:scale(.97)}
.gu .btn-gas{background:var(--grad);color:#0a1403;box-shadow:var(--glow)}
.gu .btn-gas:hover{transform:translateY(-3px);box-shadow:0 22px 52px -12px rgba(143,225,59,.62)}
.gu .btn-gas::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.5) 50%,transparent 80%);
  transform:translateX(-130%);}
.gu .btn-gas:hover::after{transform:translateX(130%);transition:transform .8s ease}
.gu .btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--tx);backdrop-filter:blur(10px)}
.gu .btn-ghost:hover{background:rgba(255,255,255,.1);transform:translateY(-3px);border-color:rgba(143,225,59,.5)}
.gu .btn-sm{--bh:46px;padding:0 22px;font-size:14px}
.gu .btn-wide{width:100%}
.gu .hdr{position:fixed;inset:0 0 auto 0;z-index:90;border-bottom:1px solid transparent;
  transition:background .35s,box-shadow .35s,border-color .35s,backdrop-filter .35s}
.gu .hdr.stuck{background:rgba(7,9,11,.84);backdrop-filter:blur(18px) saturate(160%);border-bottom-color:var(--line);box-shadow:0 10px 40px -26px #000}
.gu .hdr-in{display:flex;align-items:center;gap:22px;height:78px}
.gu .logo{display:flex;align-items:center;flex:none}
.gu .logo img{height:34px;width:auto;transition:filter .3s}
.gu .logo:hover img{filter:drop-shadow(0 6px 20px rgba(108,192,36,.5))}
.gu .logo-ftr img{height:60px}
.gu .nav{display:flex;gap:2px;margin-left:auto}
.gu .nav a{padding:9px 14px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--tx-2);white-space:nowrap;transition:color .2s,background .2s}
.gu .nav a:hover{color:var(--tx);background:rgba(255,255,255,.07)}
.gu .hdr-cta{display:flex;align-items:center;gap:14px}
.gu .hdr-tel{font-family:'Unbounded';font-weight:600;font-size:15.5px;letter-spacing:-.02em;white-space:nowrap}
.gu .hdr-tel small{display:block;font-family:'Manrope';font-weight:700;font-size:11px;color:var(--gas-2);letter-spacing:.04em}
.gu .burger{display:none;width:46px;height:46px;border-radius:13px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
.gu .burger span{display:block;width:19px;height:2px;background:var(--tx);border-radius:2px;position:relative}
.gu .burger span::before, .gu .burger span::after{content:"";position:absolute;left:0;width:19px;height:2px;background:var(--tx);border-radius:2px}
.gu .burger span::before{top:-6px}
.gu .burger span::after{top:6px}
.gu .mob{position:fixed;inset:0;z-index:95;background:rgba(7,9,11,.97);backdrop-filter:blur(20px);display:none;flex-direction:column;padding:22px var(--pad) 40px}
.gu .mob.open{display:flex}
.gu .mob-top{display:flex;width:100%;justify-content:space-between;align-items:center;height:56px}
.gu .mob nav{display:flex;flex-direction:column;gap:0;margin-top:22px;overflow-y:auto}
.gu .mob nav a{font-family:'Unbounded';font-size:21px;font-weight:600;padding:13px 0;border-bottom:1px solid var(--line)}
.gu .mob .btn{margin-top:24px;flex:none}
.gu .x{width:46px;height:46px;border-radius:13px;border:1px solid var(--line-2);background:none;font-size:22px;cursor:pointer;line-height:1}
.gu .hero{min-height:100svh;display:flex;align-items:center;padding:120px 0 56px;overflow:hidden}
.gu .hero-bg{position:absolute;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 80% at 78% 8%,rgba(108,192,36,.20),transparent 58%),
  radial-gradient(90% 70% at 4% 92%,rgba(108,192,36,.10),transparent 62%),
  var(--bg)}
.gu .hero-grid{position:absolute;inset:-40% -20% -20%;z-index:-2;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:64px 64px;
  transform:perspective(700px) rotateX(58deg);
  transform-origin:50% 0;
  animation:gridrun 22s linear infinite;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 60%,transparent 92%);
  mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 60%,transparent 92%);}
@keyframes gridrun{to{background-position:0 64px,0 0}}
.gu .blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(110px);pointer-events:none}
.gu .blob.b1{width:52vw;height:52vw;max-width:680px;max-height:680px;background:#6cc024;opacity:.24;top:-14%;right:-8%;animation:float1 15s ease-in-out infinite}
.gu .blob.b2{width:46vw;height:46vw;max-width:560px;max-height:560px;background:#2a7d1a;opacity:.20;bottom:-22%;left:-12%;animation:float2 19s ease-in-out infinite}
@keyframes float1{50%{transform:translate3d(-5%,7%,0) scale(1.09)}}
@keyframes float2{50%{transform:translate3d(7%,-6%,0) scale(1.12)}}
.gu .hero-in{max-width:940px;position:relative}
.gu .pill{display:inline-flex;align-items:center;gap:9px;padding:9px 17px 9px 11px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);backdrop-filter:blur(12px);
  font-size:13.5px;font-weight:700;color:var(--tx-2);margin-bottom:24px;}
.gu .dot{width:8px;height:8px;border-radius:50%;background:var(--gas-2);box-shadow:0 0 0 0 rgba(143,225,59,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 11px rgba(143,225,59,0)}100%{box-shadow:0 0 0 0 rgba(143,225,59,0)}}
.gu .hero h1{margin-bottom:20px}
.gu .hero h1 .w{display:inline-block;opacity:0;transform:translateY(26px) rotate(2deg);animation:wordup .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes wordup{to{opacity:1;transform:none}}
.gu .hero-sub{font-size:clamp(15.5px,1.65vw,19.5px);color:#ccd5de;max-width:62ch;margin-bottom:10px}
.gu .hero-note{font-size:14px;color:var(--tx-3);margin-bottom:30px;max-width:62ch}
.gu .hero-btns{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.gu .hero-tel{display:flex;flex-direction:column;gap:1px;padding-left:8px}
.gu .hero-tel span{font-size:12px;color:var(--tx-3);font-weight:700}
.gu .hero-tel a{font-family:'Unbounded';font-size:19px;font-weight:600;letter-spacing:-.02em}
.gu .hero-tel a:hover{color:var(--gas-2)}
.gu .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:clamp(42px,6vw,72px);background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;backdrop-filter:blur(14px)}
.gu .stat{background:rgba(14,18,23,.74);padding:24px 22px}
.gu .stat b{display:block;font-family:'Unbounded';font-size:clamp(25px,3.3vw,38px);font-weight:700;letter-spacing:-.025em;word-spacing:.12em;line-height:1}
.gu .stat span{display:block;margin-top:8px;font-size:13.5px;color:var(--tx-2);font-weight:600;line-height:1.4}
.gu .mq{border-block:1px solid var(--line);background:linear-gradient(90deg,rgba(108,192,36,.13),rgba(108,192,36,.04),rgba(108,192,36,.13));overflow:hidden;padding:15px 0}
.gu .mq-track{display:flex;gap:34px;width:max-content;animation:slide 34s linear infinite}
.gu .mq-track span{font-family:'Unbounded';font-size:14.5px;font-weight:600;color:var(--tx-2);display:flex;align-items:center;gap:34px;white-space:nowrap}
.gu .mq-track span::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gas)}
@keyframes slide{to{transform:translateX(-50%)}}
.gu .card{background:linear-gradient(180deg,var(--panel) 0%,var(--bg-2) 100%);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(24px,3.2vw,40px)}
.gu .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;margin-bottom:18px;
  background:rgba(108,192,36,.13);border:1px solid rgba(143,225,59,.28)}
.gu .ic svg{width:23px;height:23px;stroke:var(--gas-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gu .calc{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2.6vw,32px);align-items:stretch}
.gu .field{margin-bottom:22px}
.gu .field:last-child{margin-bottom:0}
.gu .field label{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:14.5px;font-weight:700;color:var(--tx-2);margin-bottom:12px}
.gu .field label b{font-family:'Unbounded';font-size:18px;color:var(--tx);font-weight:600;white-space:nowrap}
.gu input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.1);outline:none}
.gu input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--grad);cursor:grab;box-shadow:0 4px 14px rgba(108,192,36,.6),0 0 0 4px rgba(108,192,36,.16)}
.gu input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#7ccc2c;cursor:grab}
.gu .calc-out{background:radial-gradient(120% 100% at 100% 0%,rgba(108,192,36,.22),transparent 58%),linear-gradient(180deg,var(--panel-2),var(--bg-2));
  border:1px solid rgba(143,225,59,.3);display:flex;flex-direction:column;justify-content:center}
.gu .calc-out .cap{font-size:13.5px;color:var(--tx-2);font-weight:700;letter-spacing:.02em}
.gu .calc-out .big{font-family:'Unbounded';font-size:clamp(36px,5.6vw,62px);font-weight:800;letter-spacing:-.045em;line-height:1;margin:6px 0 4px}
.gu .calc-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.gu .calc-split div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-m);padding:15px 17px}
.gu .calc-split b{display:block;font-family:'Unbounded';font-size:21px;letter-spacing:-.025em}
.gu .calc-split span{font-size:12.5px;color:var(--tx-3);font-weight:700}
.gu .payback{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-m);background:rgba(108,192,36,.1);border:1px solid rgba(143,225,59,.3)}
.gu .payback b{font-family:'Unbounded';font-size:20px;letter-spacing:-.02em;color:var(--gas-3);white-space:nowrap}
.gu .payback span{font-size:13px;color:var(--tx-2);font-weight:600;line-height:1.4}
.gu .toggle{display:inline-flex;padding:5px;gap:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin-bottom:clamp(24px,3vw,36px);position:relative}
.gu .toggle button{border:0;background:none;cursor:pointer;padding:11px 22px;border-radius:999px;font-weight:800;font-size:14.5px;color:var(--tx-2);transition:color .3s;position:relative;z-index:2;white-space:nowrap}
.gu .toggle button.on{color:#0a1403}
.gu .toggle .knob{position:absolute;z-index:1;top:5px;bottom:5px;border-radius:999px;background:var(--grad);box-shadow:var(--glow);transition:left .38s cubic-bezier(.2,.8,.3,1),width .38s cubic-bezier(.2,.8,.3,1)}
.gu .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.8vw,22px)}
.gu .plan{position:relative;display:flex;flex-direction:column;border-radius:var(--r-l);border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),rgba(11,14,18,.7));padding:clamp(24px,2.6vw,34px);overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.3,1),border-color .4s,box-shadow .4s}
.gu .plan::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .4s;background:radial-gradient(90% 70% at 50% 0%,rgba(108,192,36,.16),transparent 62%)}
.gu .plan:hover{transform:translateY(-7px);border-color:rgba(143,225,59,.38);box-shadow:0 30px 60px -34px rgba(108,192,36,.6)}
.gu .plan:hover::before{opacity:1}
.gu .plan.hot{border-color:rgba(143,225,59,.45);background:linear-gradient(180deg,rgba(108,192,36,.10),rgba(11,14,18,.8))}
.gu .plan-tag{position:absolute;top:0;right:0;padding:7px 16px;border-radius:0 0 0 14px;background:var(--grad);color:#0a1403;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.gu .plan h3{font-size:clamp(19px,1.9vw,23px);position:relative}
.gu .plan .plan-for{font-size:13.5px;color:var(--tx-3);font-weight:700;margin-top:6px;position:relative}
.gu .plan-prices{display:flex;flex-direction:column;gap:1px;margin:22px 0;border-radius:var(--r-m);overflow:hidden;background:var(--line);border:1px solid var(--line);position:relative}
.gu .plan-prices div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 16px;background:rgba(9,12,15,.75)}
.gu .plan-prices small{font-size:13px;color:var(--tx-2);font-weight:700}
.gu .plan-prices b{font-family:'Unbounded';font-size:clamp(17px,1.7vw,20px);font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.gu .plan-prices div:first-child b{color:var(--gas-3)}
.gu .plan ul{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.gu .plan li{display:flex;gap:11px;font-size:14.5px;color:var(--tx-2);line-height:1.45}
.gu .plan li svg{width:17px;height:17px;flex:none;margin-top:3px;stroke:var(--gas-2);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gu .plan .btn{margin-top:auto;position:relative}
.gu .special{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,1.8vw,22px);margin-top:clamp(14px,1.8vw,22px)}
.gu .spec{position:relative;overflow:hidden;border-radius:var(--r-l);border:1px solid var(--line);background:linear-gradient(140deg,rgba(108,192,36,.12),rgba(17,21,26,.7) 52%);padding:clamp(24px,2.8vw,36px);transition:transform .4s,border-color .4s}
.gu .spec:hover{transform:translateY(-6px);border-color:rgba(143,225,59,.36)}
.gu .spec-price{font-family:'Unbounded';font-size:clamp(26px,3.2vw,38px);font-weight:800;letter-spacing:-.04em;margin:14px 0 10px}
.gu .spec p{color:var(--tx-2);font-size:14.5px;max-width:52ch}
.gu .spec .btn{margin-top:22px}
.gu .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.gu .opt{background:var(--panel);padding:20px 22px;display:flex;flex-direction:column;gap:6px;transition:background .3s}
.gu .opt span{flex:1}
.gu .opt:hover{background:var(--panel-2)}
.gu .opt span{font-size:14.5px;color:var(--tx-2);font-weight:600;line-height:1.35}
.gu .opt b{font-family:'Unbounded';font-size:18px;font-weight:600;letter-spacing:-.025em;color:var(--gas-3)}
.gu .svc-table{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--panel)}
.gu .svc-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px clamp(18px,2.2vw,26px);border-bottom:1px solid var(--line);transition:background .25s,padding-left .3s}
.gu .svc-row:last-child{border-bottom:0}
.gu .svc-row:hover{background:rgba(108,192,36,.06);padding-left:calc(clamp(18px,2.2vw,26px) + 8px)}
.gu .svc-row i{font-style:normal;font-size:15.5px;font-weight:600;color:var(--tx)}
.gu .svc-row em{font-style:normal;display:block;font-size:13px;color:var(--tx-3);font-weight:600;margin-top:3px}
.gu .svc-row b{font-family:'Unbounded';font-size:16.5px;font-weight:600;letter-spacing:-.025em;color:var(--gas-3);white-space:nowrap}
.gu .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,1.4vw,18px);counter-reset:s}
.gu .step{position:relative;padding:clamp(22px,2.4vw,30px);border-radius:var(--r-l);background:linear-gradient(180deg,var(--panel),rgba(11,14,18,.6));border:1px solid var(--line);transition:transform .35s,border-color .35s}
.gu .step:hover{transform:translateY(-6px);border-color:rgba(143,225,59,.36)}
.gu .step-n{font-family:'Unbounded';font-size:12.5px;font-weight:800;letter-spacing:.1em;color:var(--gas-2);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.gu .step-n i{flex:1;height:1px;background:linear-gradient(90deg,rgba(143,225,59,.5),transparent);font-style:normal}
.gu .step h3{font-size:clamp(16px,1.4vw,18px);margin-bottom:10px}
.gu .step p{color:var(--tx-2);font-size:14px}
.gu .why-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(13px,1.5vw,20px)}
.gu .why-card{grid-column:span 2;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(22px,2.5vw,32px);position:relative;overflow:hidden;transition:transform .35s,border-color .35s}
.gu .why-card::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s;background:radial-gradient(90% 80% at 0% 0%,rgba(108,192,36,.16),transparent 62%)}
.gu .why-card:hover{transform:translateY(-6px);border-color:rgba(143,225,59,.36)}
.gu .why-card:hover::before{opacity:1}
.gu .why-card h3{margin-bottom:10px;font-size:clamp(17px,1.5vw,20px);position:relative}
.gu .why-card p{color:var(--tx-2);font-size:14.5px;position:relative}
